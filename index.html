<!doctype html>
<html lang="fr-BE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f4">
  <title>Claude Cars — Comparer les trois versions</title>
  <style>
    @font-face {font-family:Archivo;src:url("demo/studio/assets/archivo.ttf") format("truetype");font-weight:100 900;font-display:swap}
    * {box-sizing:border-box}
    body {margin:0;background:#f7f7f4;color:#202321;font:16px/1.5 Archivo,Arial,sans-serif}
    main {max-width:1200px;margin:auto;padding:clamp(30px,7vw,96px) clamp(18px,4.5vw,66px)}
    h1 {font-size:clamp(42px,7.6vw,90px);line-height:1;letter-spacing:-.065em;margin:0;font-weight:730}
    p {margin:12px 0 0;font-size:clamp(16px,1.6vw,21px);color:#525951}
    .versions {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(16px,2vw,32px);margin-top:clamp(25px,4vw,52px)}
    a {display:block;color:inherit;text-decoration:none;background:#fff;border:1px solid #cdd1c9;border-radius:6px;overflow:hidden}
    a:hover {border-color:#4f5650}
    a:focus-visible {outline:3px solid #285ea1;outline-offset:4px}
    picture,img {display:block;width:100%}
    img {height:auto;aspect-ratio:1.78;object-fit:cover;object-position:top left}
    .label {display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-top:1px solid #dce0d9;font-size:20px;letter-spacing:-.035em;font-weight:650}
    .label span {font-size:22px;font-weight:400}
    @media(max-width:760px){.versions{grid-template-columns:1fr}.label{padding:9px 13px;font-size:18px}}
  @media(max-width:760px){.versions a{display:grid;grid-template-columns:minmax(110px,44%) 1fr;align-items:center}.versions .label{border-top:0;font-size:16px;gap:6px}.versions{gap:14px}}
  </style>
</head>
<body><main>
  <h1>Claude Cars</h1>
  <p>Choisissez une version pour explorer la démo.</p>
  <div class="versions">
    <a href="demo/"><img src="version-a.jpg" width="1080" height="608" alt=""><span class="label">Version A <span aria-hidden="true">→</span></span></a>
    <a href="demo/studio/"><img src="version-b.jpg" width="1080" height="608" alt=""><span class="label">Version B <span aria-hidden="true">→</span></span></a>
    <a href="version-c/fr/"><img src="version-c.jpg" width="1080" height="608" alt=""><span class="label">Version C · Actuelle <span aria-hidden="true">→</span></span></a>
  </div>
</main></body></html>
